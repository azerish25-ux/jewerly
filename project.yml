# XcodeGen manifest for the Jewelcraft iPadOS studio.
#
# The project file itself is generated, never committed: `xcodegen generate`
# rebuilds it from this manifest on any machine, which is what lets CI check out
# a clean tree and produce an app without a checked-in pbxproj drifting away from
# the source layout.

name: Jewelcraft

options:
  bundleIdPrefix: studio.jewelcraft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

packages:
  JewelcraftKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  Jewelcraft:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: JewelcraftKit
        product: JewelcraftKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Jewelcraft
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - armv8
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.jewelcraft.app
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ENABLE_PREVIEWS: YES

  JewelcraftUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Jewelcraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: studio.jewelcraft.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: Jewelcraft

schemes:
  Jewelcraft:
    build:
      targets:
        Jewelcraft: all
        JewelcraftUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - JewelcraftUITests
    archive:
      config: Release
